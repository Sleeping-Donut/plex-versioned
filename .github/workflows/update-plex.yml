name: Update Plex Beta Release

on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: "Optional prefix for the Git tag (leave blank for exact version)"
        required: false
        default: "v"

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare pinned version against the Plex API
        id: check
        env:
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
        run: ./scripts/check-plex-release.sh

  update:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update Plex release metadata, commit, and tag
        env:
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: ./scripts/update-plex-release.sh
